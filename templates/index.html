<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language Translator — Real-Time AI</title>
    <meta name="description" content="Real-time sign language translation using AI and computer vision. Detects sign language gestures and converts them into sentences.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- ── Animated background ──────────────────────────────────────── -->
    <div class="bg-gradient"></div>
    <div class="bg-grid"></div>

    <!-- ── Header ───────────────────────────────────────────────────── -->
    <header id="app-header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 1 1 3 0m-3 6a1.5 1.5 0 0 0-3 0v2a7.5 7.5 0 0 0 15 0v-5a1.5 1.5 0 0 0-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 0 1 3 0v1m0 0V11m0-5.5a1.5 1.5 0 0 1 3 0v3.5"/>
                    </svg>
                </div>
                <div>
                    <h1>Sign Language Translator</h1>
                    <p class="subtitle">Real-Time AI-Powered Detection</p>
                </div>
            </div>
            <div class="header-status">
                <div class="status-pill" id="status-pill">
                    <span class="status-dot"></span>
                    <span class="status-text">Connecting...</span>
                </div>
                <div class="fps-badge" id="fps-badge">-- FPS</div>
            </div>
        </div>
    </header>

    <!-- ── Main Content ─────────────────────────────────────────────── -->
    <main id="app-main">
        <div class="main-grid">
            <!-- Video Feed -->
            <section class="video-section" id="video-section">
                <div class="video-container">
                    <img id="video-feed" src="/video_feed" alt="Live webcam feed with sign language detection">
                    <div class="video-overlay" id="video-overlay">
                        <div class="detection-badge" id="detection-badge">
                            <span class="detection-sign" id="detected-sign">—</span>
                            <div class="confidence-bar-container">
                                <div class="confidence-bar" id="confidence-bar"></div>
                            </div>
                            <span class="confidence-text" id="confidence-text">0%</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Sidebar -->
            <aside class="sidebar">
                <!-- Current Sentence -->
                <div class="card sentence-card" id="sentence-card">
                    <div class="card-header">
                        <h2>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="card-icon">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                            </svg>
                            Current Sentence
                        </h2>
                        <div class="card-actions">
                            <button class="btn btn-ghost" id="btn-clear" title="Clear sentence">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="sentence-display" id="sentence-display">
                        <p class="sentence-text" id="current-sentence">Waiting for signs...</p>
                    </div>
                    <div class="sentence-actions">
                        <button class="btn btn-primary" id="btn-save">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                                <polyline points="17 21 17 13 7 13 7 21"/>
                                <polyline points="7 3 7 8 15 8"/>
                            </svg>
                            Save Sentence
                        </button>
                        <button class="btn btn-secondary" id="btn-toggle">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="6" y="4" width="4" height="16"/>
                                <rect x="14" y="4" width="4" height="16"/>
                            </svg>
                            Pause
                        </button>
                    </div>
                </div>

                <!-- Detected Signs -->
                <div class="card signs-card" id="signs-card">
                    <div class="card-header">
                        <h2>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="card-icon">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                                <line x1="12" y1="17" x2="12.01" y2="17"/>
                            </svg>
                            Available Signs
                        </h2>
                    </div>
                    <div class="signs-grid" id="signs-grid">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- Sentence History -->
                <div class="card history-card" id="history-card">
                    <div class="card-header">
                        <h2>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="card-icon">
                                <circle cx="12" cy="12" r="10"/>
                                <polyline points="12 6 12 12 16 14"/>
                            </svg>
                            History
                        </h2>
                    </div>
                    <ul class="history-list" id="history-list">
                        <li class="history-empty">No sentences yet. Start signing!</li>
                    </ul>
                </div>
            </aside>
        </div>
    </main>

    <!-- ── Toast Notification ───────────────────────────────────────── -->
    <div class="toast" id="toast">
        <span class="toast-message" id="toast-message"></span>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
